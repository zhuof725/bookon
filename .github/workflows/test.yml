name: Swift Build & Test

on:
  push:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    container:
      image: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Verify field coverage
        run: python3 scripts/verify_fields.py
      - name: Verify function coverage
        run: python3 scripts/verify_functions.py
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v

  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Verify field coverage
        run: python3 scripts/verify_fields.py
      - name: Verify function coverage
        run: python3 scripts/verify_functions.py
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
