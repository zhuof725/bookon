name: Swift Build & Test

on:
  push:
  workflow_dispatch:

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build golden generator (Maven)
        working-directory: scripts/golden
        run: mvn -B -ntp package
      - name: Generate golden data (real jsoup 1.16.2 + JsoupXpath 2.5.3)
        working-directory: scripts/golden
        run: |
          set -e
          java -jar target/golden-generator.jar cases out
          echo "=== 生成的文件 ==="
          ls -la out
          COUNT=$(ls out/*.json 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "错误：未生成任何 golden 文件"
            exit 1
          fi
      - name: Upload golden artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-data
          path: scripts/golden/out/*.json
          if-no-files-found: error

  test-macos:
    runs-on: macos-14
    needs: golden
    steps:
      - uses: actions/checkout@v4
      - name: Download golden artifact
        uses: actions/download-artifact@v4
        with:
          name: golden-data
          path: Tests/LegadoHTMLEngineTests/Resources/golden
      - name: Mirror golden for AnalyzeRule end-to-end tests
        run: |
          mkdir -p Tests/LegadoAnalyzeRuleTests/Resources/golden
          cp Tests/LegadoHTMLEngineTests/Resources/golden/*.json Tests/LegadoAnalyzeRuleTests/Resources/golden/
          mkdir -p Tests/LegadoNetworkTests/Resources/golden
          cp Tests/LegadoHTMLEngineTests/Resources/golden/*.json Tests/LegadoNetworkTests/Resources/golden/
          mkdir -p Tests/LegadoWebBookTests/Resources/golden
          cp Tests/LegadoHTMLEngineTests/Resources/golden/*.json Tests/LegadoWebBookTests/Resources/golden/
      - name: List golden files
        run: ls -la Tests/LegadoHTMLEngineTests/Resources/golden
      - name: Show Swift version
        run: swift --version
      - name: Verify field coverage
        run: python3 scripts/verify_fields.py
      - name: Verify function coverage
        run: python3 scripts/verify_functions.py
      - name: Verify platform-only API usage
        run: python3 scripts/verify_platform_apis.py
      - name: Build
        run: swift build -v
      - name: Run tests (macOS, swift test)
        run: |
          set -o pipefail
          swift test -v 2>&1 | tee macos_test_output.log
      - name: Extract macOS test count
        run: |
          set -e
          COUNT=$(python3 scripts/extract_macos_count.py macos_test_output.log)
          echo "macOS 测试总数: $COUNT"
          echo "$COUNT" > macos_test_count.txt
      - name: Upload macOS test count
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-count
          path: macos_test_count.txt
          if-no-files-found: error

  test-ios-simulator:
    runs-on: macos-14
    needs: [golden, test-macos]
    steps:
      - uses: actions/checkout@v4
      - name: Download golden artifact
        uses: actions/download-artifact@v4
        with:
          name: golden-data
          path: Tests/LegadoHTMLEngineTests/Resources/golden
      - name: Mirror golden for AnalyzeRule end-to-end tests
        run: |
          mkdir -p Tests/LegadoAnalyzeRuleTests/Resources/golden
          cp Tests/LegadoHTMLEngineTests/Resources/golden/*.json Tests/LegadoAnalyzeRuleTests/Resources/golden/
          mkdir -p Tests/LegadoNetworkTests/Resources/golden
          cp Tests/LegadoHTMLEngineTests/Resources/golden/*.json Tests/LegadoNetworkTests/Resources/golden/
          mkdir -p Tests/LegadoWebBookTests/Resources/golden
          cp Tests/LegadoHTMLEngineTests/Resources/golden/*.json Tests/LegadoWebBookTests/Resources/golden/
      - name: Download macOS test count artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-test-count
          path: macos-test-count
      - name: List golden files
        run: ls -la Tests/LegadoHTMLEngineTests/Resources/golden
      - name: Show macOS test count (for iOS==macOS parity check)
        run: cat macos-test-count/macos_test_count.txt
      - name: Show Swift / Xcode version
        run: |
          swift --version
          xcodebuild -version
      - name: Verify field coverage
        run: python3 scripts/verify_fields.py
      - name: Verify function coverage
        run: python3 scripts/verify_functions.py
      - name: List available iOS simulators
        run: xcrun simctl list devices available | grep -i iphone || true
      # 注意执行顺序：必须**先跑测试、再 xcodegen generate**。
      # 原因（CI run 37301725529）：ios_sim_test.sh 依赖 SwiftPM 包自动生成的 scheme
      # `LegadoBookSource`（它带 test action）。一旦仓库根目录出现 BookonDebug.xcodeproj，
      # xcodebuild 就会解析该 .xcodeproj，而其中的 `LegadoBookSource` 是 library scheme、
      # **没有 test action**，于是报：
      #   xcodebuild: error: Scheme LegadoBookSource is not currently configured for the test action.
      # 把测试步骤放在 xcodegen generate 之前即可让 xcodebuild 继续走 SwiftPM 包模式。
      - name: Run tests on iOS Simulator (xcodebuild test)
        run: |
          # 双保险：清掉任何可能残留的 .xcodeproj，确保走 SwiftPM 包模式。
          rm -rf BookonDebug.xcodeproj
          bash scripts/ios_sim_test.sh
      - name: Build App target (XcodeGen + iOS Simulator)
        run: |
          brew install xcodegen
          xcodegen generate
          bash scripts/verify_xcodeproj_format.sh BookonDebug.xcodeproj
          xcodebuild build \
            -project BookonDebug.xcodeproj \
            -scheme BookonDebug \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  # 第 7 步 C 段：构建「书源调试」App 并打包 IPA（无签名，供侧载/分发调试）。
  build-ipa:
    runs-on: macos-14
    needs: [golden, test-macos]
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build IPA (archive → Payload → ipa，注入 commit/run_id)
        env:
          GIT_COMMIT: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: bash scripts/build_ipa.sh
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookon-debug-ipa
          path: build/BookonDebug.ipa
          if-no-files-found: error

  # 第 6 步 6B（可选任务）：真实网络冒烟。
  # 仅 workflow_dispatch 触发（push 不跑，避免外网站点抖动影响主链路）。
  # 对仓库内真实书源配置（Tests/LegadoAnalyzeRuleTests/Resources/配置文件_7个.json）
  # 用 AnalyzeUrl 解析搜索 URL（关键字「斗罗」）+ URLSessionHTTPClient 真实请求，
  # 输出报告 artifact；**失败不算 CI 失败**（continue-on-error: true）。
  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Run live smoke (real network, keyword 斗罗)
        continue-on-error: true
        env:
          LEGADO_LIVE_SMOKE: '1'
          LEGADO_LIVE_SMOKE_OUT: live-smoke-out
        run: |
          mkdir -p live-smoke-out
          set -o pipefail
          swift test --filter LiveSmokeTests 2>&1 | tee live_smoke_test.log || true
          echo "=== 报告内容 ==="
          cat live-smoke-out/live_smoke_report.txt 2>/dev/null || echo "（未生成报告：可能全部书源都不可达）"
      - name: Upload live smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-report
          path: |
            live-smoke-out/live_smoke_report.txt
            live_smoke_test.log
          if-no-files-found: warn
