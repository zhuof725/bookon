name: Swift Build & Test

on:
  push:
  workflow_dispatch:

jobs:
  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Verify field coverage
        run: python3 scripts/verify_fields.py
      - name: Verify function coverage
        run: python3 scripts/verify_functions.py
      - name: Build
        run: swift build -v
      - name: Run tests (macOS, swift test)
        run: swift test -v

  test-ios-simulator:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift / Xcode version
        run: |
          swift --version
          xcodebuild -version
      - name: Verify field coverage
        run: python3 scripts/verify_fields.py
      - name: Verify function coverage
        run: python3 scripts/verify_functions.py
      - name: List available iOS simulators
        run: xcrun simctl list devices available | grep -i iphone || true
      - name: Discover scheme name
        id: scheme
        run: |
          echo "可用 scheme 列表："
          xcodebuild -list || true
          # SwiftPM 包的自动 scheme 名通常等于 package/library 名；这里取第一个 scheme。
          SCHEME=$(xcodebuild -list -json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('workspace') or d.get('project') or {}).get('schemes',['LegadoBookSource'])[0])")
          echo "选用 scheme: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"
      - name: Run tests on iOS Simulator (xcodebuild test)
        run: |
          set -o pipefail
          # 选一个可用的 iPhone 模拟器 UDID。
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin);import re;
devs=[dev for runtime,arr in d['devices'].items() if 'iOS' in runtime for dev in arr if dev.get('isAvailable') and 'iPhone' in dev['name']]
print(devs[0]['udid'] if devs else '')")
          echo "使用模拟器 UDID: $UDID  scheme: ${{ steps.scheme.outputs.name }}"
          if [ -z "$UDID" ]; then
            xcodebuild test -scheme "${{ steps.scheme.outputs.name }}" -destination 'platform=iOS Simulator,name=iPhone 15'
          else
            xcodebuild test -scheme "${{ steps.scheme.outputs.name }}" -destination "platform=iOS Simulator,id=$UDID"
          fi
