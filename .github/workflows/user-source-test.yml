name: Uploaded source test

on:
  workflow_dispatch:
    inputs:
      key:
        description: 搜索关键词
        required: true
        default: 斗罗大陆
      file:
        description: 书源文件（仓库内路径）
        required: false
        default: user-sources.json
      check:
        description: 批量校验（校验书源：搜索→详情→目录→正文，失败写回失效分组）
        type: boolean
        default: false
      probe:
        description: 目录诊断（打印目录页原始内容、节点类型与标题/地址规则输出）
        type: boolean
        default: false

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Swift package
        run: |
          P=$RUNNER_TEMP/pkg
          mkdir -p $P/Sources/SourceTest
          cp Sources/Engine/*.swift Sources/Models/*.swift $P/Sources/SourceTest/
          cp Tools/SourceTest/*.swift $P/Sources/SourceTest/
          cat > $P/Package.swift <<'EOF'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(
            name: "SourceTest",
            platforms: [.macOS(.v13)],
            dependencies: [
              .package(url: "https://github.com/scinfu/SwiftSoup.git", from: "2.7.0"),
              .package(url: "https://github.com/tid-kijyun/Kanna.git", from: "5.2.7")
            ],
            targets: [.executableTarget(name: "SourceTest", dependencies: ["SwiftSoup", "Kanna"])]
          )
          EOF
          sed -i '' 's/^          //' $P/Package.swift
      - name: Build
        run: |
          set -o pipefail
          cd $RUNNER_TEMP/pkg
          swift build -c release 2>&1 | tee "$GITHUB_WORKSPACE/test-build.log"
      - name: Fixed rule regression
        run: |
          set -o pipefail
          $RUNNER_TEMP/pkg/.build/release/SourceTest --regression 2>&1 | tee regression.log
      - name: Test uploaded sources
        env:
          TEST_KEY: ${{ github.event.inputs.key }}
          SOURCES_FILE: ${{ github.event.inputs.file }}
        run: |
          set -o pipefail
          KEY="$TEST_KEY"
          $RUNNER_TEMP/pkg/.build/release/SourceTest "${SOURCES_FILE:-user-sources.json}" "$KEY" 90 2>&1 | tee user-source-test.log
      - name: Batch check sources (校验书源)
        if: ${{ inputs.check }}
        env:
          SOURCES_FILE: ${{ github.event.inputs.file }}
        timeout-minutes: 30
        run: |
          set -o pipefail
          $RUNNER_TEMP/pkg/.build/release/SourceTest --check-batch "${SOURCES_FILE:-user-sources.json}" 我的 90 2 0 2>&1 | tee batch-check.log
      - name: TOC probe
        if: ${{ inputs.probe }}
        env:
          SOURCES_FILE: ${{ github.event.inputs.file }}
          TEST_KEY: ${{ github.event.inputs.key }}
        run: |
          set -o pipefail
          $RUNNER_TEMP/pkg/.build/release/SourceTest --probe-toc "${SOURCES_FILE:-user-sources.json}" "${TEST_KEY:-我的}" 2>&1 | tee toc-probe.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-source-test
          path: |
            user-source-test.log
            batch-check.log
            toc-probe.log
            regression.log
            test-build.log
            dumps/
