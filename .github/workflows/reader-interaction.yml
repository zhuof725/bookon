name: Reader interaction test
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test scope
        type: choice
        default: smoke
        options: [cover-persistence, app-font, smoke, continuity, scroll, typography, bottom-bubble, audit, natural, pageflow, native, paper, chrome, shelf, detail, toc-rules, body-rules, body-only, font-management, font-import, appearance, theme, full]
  push:
    branches: [main, fix/source-compat-runtime]
    paths: ['Sources/App/CommentViews.swift', 'Sources/App/Reader*.swift', 'Sources/App/*PageTurn*.swift', 'Sources/App/Views.swift', 'Sources/App/VolumeTitleView.swift', 'Sources/App/ChapterTitleView.swift', 'Sources/Store/ReadSettings.swift', 'Sources/Engine/ChapterNavigation.swift', 'Tools/ReaderInteractionTest/**', '.github/workflows/reader-interaction.yml']
concurrency:
  group: reader-interaction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: TXT rule parser regression
        if: ${{ inputs.suite == 'toc-rules' }}
        run: |
          set -euo pipefail
          {
            xcrun --sdk macosx swiftc -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
              Sources/Models/TxtTocRule.swift Sources/Engine/LocalBook.swift Sources/Engine/ZipReader.swift \
              Tools/SourceTest/LocalBookRegression.swift Tools/TxtTocRuleTest/main.swift \
              -framework Foundation -lcompression -o "$RUNNER_TEMP/txt-toc-rule-regression"
            "$RUNNER_TEMP/txt-toc-rule-regression"
          } 2>&1 | tee toc-rule-regression.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.suite == 'toc-rules' }}
        with:
          name: toc-rule-regression-log
          path: toc-rule-regression.log
      - name: Body replacement engine and repository regression
        if: ${{ (inputs.suite == 'body-rules' || inputs.suite == 'body-only') }}
        run: |
          set -euo pipefail
          {
            xcrun --sdk macosx swiftc -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
              Sources/Models/BodyReplaceRule.swift Tools/BodyReplaceTest/main.swift \
              -framework Foundation -o "$RUNNER_TEMP/body-replace-regression"
            "$RUNNER_TEMP/body-replace-regression"
          } 2>&1 | tee body-replace-regression.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (inputs.suite == 'body-rules' || inputs.suite == 'body-only') }}
        with:
          name: body-replace-regression-log
          path: body-replace-regression.log
      - name: Install XcodeGen and diagnostic tools
        run: brew install xcodegen ripgrep
      - name: Generate focused test project
        run: cd Tools/ReaderInteractionTest && xcodegen generate
      - name: Pick available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/devices.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          devices = json.load(open('/tmp/devices.json'))['devices']
          phones = [d for group in devices.values() for d in group if d['name'].startswith('iPhone')]
          assert phones
          print('SIMULATOR_ID=' + phones[0]['udid'])
          PY
      - name: Boot selected simulator
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Test native reader interactions
        env:
          TEST_SUITE: ${{ inputs.suite || 'smoke' }}
        run: |
          set -o pipefail
          ARGS=()
          case "$TEST_SUITE" in
            cover-persistence) ARGS=(-only-testing:ReaderInteractionTests/CoverPersistenceTests) ;;
            bottom-bubble) ARGS=(-only-testing:ReaderInteractionTests/BottomBubbleTests -only-testing:ReaderInteractionTests/TypographyTests/testNativeGlyphsFixedBaselinesAndActualLinePagination -only-testing:ReaderInteractionTests/ReaderPageFlowTests -only-testing:ReaderInteractionTests/InteractionTests) ;;
            pageflow) ARGS=(-only-testing:ReaderInteractionTests/ReaderPageFlowTests -only-testing:ReaderInteractionTests/LayoutAuditTests -only-testing:ReaderInteractionTests/TypographyTests/testNativeGlyphsFixedBaselinesAndActualLinePagination -only-testing:ReaderInteractionTests/InteractionTests) ;;
            natural) ARGS=(-only-testing:ReaderInteractionTests/ReaderPageFlowTests -only-testing:ReaderInteractionTests/PunctuationFlowTests -only-testing:ReaderInteractionTests/LayoutAuditTests -only-testing:ReaderInteractionTests/TypographyTests/testNativeGlyphsFixedBaselinesAndActualLinePagination -only-testing:ReaderInteractionTests/InteractionTests -only-testing:ReaderInteractionTests/ContinuousScrollTests) ;;
            audit) ARGS=(-only-testing:ReaderInteractionTests/LayoutAuditTests -only-testing:ReaderInteractionTests/TypographyTests/testNativeGlyphsFixedBaselinesAndActualLinePagination -only-testing:ReaderInteractionTests/InteractionTests) ;;
            typography) ARGS=(-only-testing:ReaderInteractionTests/TypographyTests/testNativeGlyphsFixedBaselinesAndActualLinePagination -only-testing:ReaderInteractionTests/InteractionTests) ;;
            native) ARGS=(-only-testing:ReaderInteractionTests/NativeReaderTests) ;;
            theme) ARGS=(-only-testing:ReaderInteractionTests/ThemeTests) ;;
            appearance) ARGS=(-only-testing:ReaderInteractionTests/ThemeTests -only-testing:ReaderInteractionTests/ShelfTests -only-testing:ReaderInteractionTests/DetailTests -only-testing:ReaderInteractionTests/ChromeTests) ;;
            chrome) ARGS=(-only-testing:ReaderInteractionTests/ChromeTests) ;;
            shelf) ARGS=(-only-testing:ReaderInteractionTests/ShelfTests) ;;
            detail) ARGS=(-only-testing:ReaderInteractionTests/DetailTests) ;;
            toc-rules) ARGS=(-only-testing:ReaderInteractionTests/TocRulesTests) ;;
            app-font) ARGS=(-only-testing:ReaderInteractionTests/AppFontTests -only-testing:ReaderInteractionTests/FontTests/testReadingPipelineFontIdentityAndPagination) ;;
            font-import) ARGS=(-only-testing:ReaderInteractionTests/FontTests/testUIKitPickerCallbacksUseRealFontImporter -only-testing:ReaderInteractionTests/FontTests/testUIKitPickerPresentationAndCancellation -only-testing:ReaderInteractionTests/FontTests/testFontRepositoryImportPersistenceAndRollback) ;;
            font-management) ARGS=(-only-testing:ReaderInteractionTests/FontTests -only-testing:ReaderInteractionTests/TypographyTests/testNativeGlyphsFixedBaselinesAndActualLinePagination -only-testing:ReaderInteractionTests/InteractionTests) ;;
            body-only) ARGS=(-only-testing:ReaderInteractionTests/BodyRulesTests) ;;
            body-rules) ARGS=(-only-testing:ReaderInteractionTests/BodyRulesTests -only-testing:ReaderInteractionTests/TocRulesTests) ;;
            paper) ARGS=(-only-testing:ReaderInteractionTests/NativeReaderTests/testNativeCurlCachedChaptersThemeAndRefresh) ;;
            scroll) ARGS=(-only-testing:ReaderInteractionTests/ContinuousScrollTests) ;;
            continuity) ARGS=(-only-testing:ReaderInteractionTests/NativeReaderTests -only-testing:ReaderInteractionTests/ContinuousScrollTests -only-testing:ReaderInteractionTests/InteractionTests) ;;
            full) ;;
            *) ARGS=(-only-testing:ReaderInteractionTests/NativeReaderTests -only-testing:ReaderInteractionTests/ContinuousScrollTests -only-testing:ReaderInteractionTests/CoverTurnTests -only-testing:ReaderInteractionTests/TypographyTests -only-testing:ReaderInteractionTests/InteractionTests) ;;
          esac
          xcodebuild -project Tools/ReaderInteractionTest/ReaderInteraction.xcodeproj \
            -scheme ReaderHarness -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 "${ARGS[@]}" \
            -resultBundlePath reader-interaction.xcresult CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee reader-interaction.log
      - name: Print crash diagnostics on failure
        if: failure()
        run: |
          set +e
          xcrun xcresulttool export diagnostics --path reader-interaction.xcresult --output-path diagnostics >/dev/null 2>&1
          python3 - <<'PY'
          import subprocess, pathlib, zipfile
          files = subprocess.run(['rg', '--files', '-uuu', 'diagnostics'], text=True, capture_output=True).stdout.splitlines()
          def report(name, raw):
              if 'harness' not in name.lower(): return
              needles = ['terminating app', 'reason:', 'uncaught exception', 'reader-exception', 'lastExceptionBacktrace']
              for line in raw.decode('utf-8', 'replace').splitlines():
                  if any(word.lower() in line.lower() for word in needles):
                      print('CRASH>', name, line[:9000])
          for name in files:
              path = pathlib.Path(name)
              if path.suffix in ['.txt', '.ips', '.crash']:
                  report(name, path.read_bytes())
              elif path.suffix == '.zip':
                  try:
                      with zipfile.ZipFile(path) as z:
                          for entry in z.namelist():
                              if 'harness' in entry.lower(): report(entry, z.read(entry))
                  except Exception as error: print('diagnostics error', error)
          PY
      - name: Export reader screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path reader-interaction.xcresult --output-path reader-screenshots || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (inputs.suite == 'appearance' || inputs.suite == 'theme') }}
        with:
          name: appearance-screenshots
          path: |
            reader-screenshots/**/*.png
            reader-screenshots/**/*.jpg
            reader-screenshots/**/*.jpeg
            reader-screenshots/**/*.heic
            reader-screenshots/manifest.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.suite == 'chrome' }}
        with:
          name: reader-chrome-screenshots
          path: reader-screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.suite == 'shelf' }}
        with:
          name: shelf-screenshots
          path: reader-screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.suite == 'detail' }}
        with:
          name: detail-screenshots
          path: reader-screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ always() && ((inputs.suite == 'body-rules' || inputs.suite == 'body-only') || inputs.suite == 'full') }}
        with:
          name: body-rules-screenshots
          path: |
            reader-screenshots/**/*.png
            reader-screenshots/**/*.jpg
            reader-screenshots/**/*.jpeg
            reader-screenshots/**/*.heic
            reader-screenshots/manifest.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (inputs.suite == 'toc-rules' || inputs.suite == 'full') }}
        with:
          name: toc-rules-screenshots
          path: |
            reader-screenshots/**/*.png
            reader-screenshots/**/*.jpg
            reader-screenshots/**/*.jpeg
            reader-screenshots/**/*.heic
            reader-screenshots/manifest.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ always() && (inputs.suite == 'app-font' || inputs.suite == 'font-management' || inputs.suite == 'font-import') }}
        with:
          name: font-management-screenshots
          path: reader-screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.suite == 'cover-persistence' }}
        with:
          name: cover-persistence-screenshots
          path: |
            reader-screenshots/**/*.png
            reader-screenshots/**/*.jpg
            reader-screenshots/**/*.jpeg
            reader-screenshots/**/*.heic
            reader-screenshots/manifest.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.suite == 'search-history' }}
        with:
          name: search-history-screenshots
          path: |
            reader-screenshots/**/*.png
            reader-screenshots/**/*.jpg
            reader-screenshots/**/*.jpeg
            reader-screenshots/**/*.heic
            reader-screenshots/manifest.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-interaction-results
          path: |
            reader-interaction.log
            reader-interaction.xcresult
            reader-screenshots
