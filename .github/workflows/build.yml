name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ['v*']
    # 只改文档/书源快照/README 时不值得占 5 分钟 macOS runner。
    paths-ignore:
      - 'docs/**'
      - 'data/**'
      - '**.md'
  workflow_dispatch:

# 同一分支连续推送时，只保留最后一次构建（tag 构建不互相取消）。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_1[6-9]*.app /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -n 1)
          echo "Using $X"
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          python3 -c 'import subprocess; v=subprocess.check_output(["xcrun","--sdk","iphoneos","--show-sdk-version"],text=True); assert int(v.split(".")[0]) >= 26, "iOS26 SDK required for native Liquid Glass"'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project BookOn.xcodeproj -scheme BookOn

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project BookOn.xcodeproj \
            -scheme BookOn \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | xcpretty || (tail -n 200 build.log; exit 1)

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr BookOn-unsigned.ipa Payload
          ls -la BookOn-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookOn-unsigned-ipa
          path: BookOn-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # 打 tag（v0.2.0 之类）时顺便把 IPA 挂到 Release 上，留档可回溯。
      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" BookOn-unsigned.ipa --clobber \
            || gh release create "$TAG" BookOn-unsigned.ipa \
                 --title "尚书 $TAG" \
                 --notes "未签名 IPA，需自行签名安装。提交：${{ github.sha }}" \
                 --generate-notes
