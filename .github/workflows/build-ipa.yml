name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BookOn.xcodeproj \
            -scheme BookOn \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: |BUILD" || true
          test -d build/Build/Products/Release-iphoneos/BookOn.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BookOn.app Payload/
          zip -qry BookOn.ipa Payload
          ls -lh BookOn.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookOn-ipa
          path: BookOn.ipa

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest BookOn.ipa \
            --title "BookOn 最新构建 (${GITHUB_SHA::7})" \
            --notes "自动构建，未签名 IPA，需自行签名安装。" \
            --prerelease

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
