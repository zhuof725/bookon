name: ReaderInteraction
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ReaderHarness:
    type: application
    platform: iOS
    sources:
      - path: Harness.swift
      - path: ThemeHarness.swift
      - path: TocRulesHarness.swift
      - path: BodyRulesHarness.swift
      - path: ../../Sources/Models/BodyReplaceRule.swift
      - path: ../../Sources/App/BodyReplaceRulesView.swift
      - path: ../../Sources/Models/TxtTocRule.swift
      - path: ../../Sources/App/TxtTocRulesView.swift
      - path: ../../Sources/App/AppPalette.swift
      - path: ../../Sources/App/AppTypography.swift
      - path: AppFontHarness.swift
      - path: ShelfHarness.swift
      - path: DetailHarness.swift
      - path: ../../Sources/App/BookDetailScreen.swift
      - path: ../../Sources/App/BookshelfScreen.swift
      - path: ../../Sources/App/LibraryDock.swift
      - path: ChromeHarness.swift
      - path: ChapterHarness.swift
      - path: VolumeHarness.swift
      - path: TypographyHarness.swift
      - path: FontHarness.swift
      - path: Fixtures/Fonts
        buildPhase: resources
        type: folder
      - path: ../../Sources/App/ReadingFontManager.swift
      - path: ../../Sources/App/FontManagerView.swift
      - path: ../../Sources/App/FontDocumentPicker.swift
      - path: ../../Sources/App/ReaderFontResolver.swift
      - path: BottomBubbleHarness.swift
      - path: BottomBubblePixelAudit.swift
      - path: Fixtures/bubble-outline-590.png
        buildPhase: resources
      - path: Fixtures/bubble-3-590.png
        buildPhase: resources
      - path: ContinuousScrollHarness.swift
      - path: CoverTurnHarness.swift
      - path: LayoutAuditHarness.swift
      - path: PunctuationFlowHarness.swift
      - path: ReaderPageFlowHarness.swift
      - path: ../../Sources/App/ReaderCoverPageTurnView.swift
      - path: ../../Sources/App/ReaderContinuousScrollView.swift
      - path: ../../Sources/App/CommentViews.swift
      - path: ../../Sources/App/ReaderTextLayout.swift
      - path: ../../Sources/App/PageTurnView.swift
      - path: ../../Sources/App/PageTurnCoordinator.swift
      - path: ../../Sources/App/ReaderPageHost.swift
      - path: ../../Sources/App/ReaderPaginator.swift
      - path: ../../Sources/App/ReaderChrome.swift
      - path: ../../Sources/App/ReaderMenuActions.swift
      - path: ../../Sources/App/VolumeTitleView.swift
      - path: ../../Sources/App/ChapterTitleView.swift
      - path: ../../Sources/App/ReaderTypographyControls.swift
      - path: ../../Sources/Store/ReadSettings.swift
      - path: ../../Sources/Models/Models.swift
      - path: ../../Sources/App/ReaderScrollBoundaryObserver.swift
      - path: ../../Sources/Engine/Paginator.swift
      - path: ../../Sources/Engine/ContentBlocks.swift
      - path: ../../Sources/Engine/ChapterNavigation.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.readerharness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ReaderInteractionTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ReaderHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.readerinteractiontests
        TEST_TARGET_NAME: ReaderHarness
schemes:
  ReaderHarness:
    build:
      targets:
        ReaderHarness: all
        ReaderInteractionTests: [test]
    test:
      targets:
        - ReaderInteractionTests
