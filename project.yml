# 第 7 步 C 段：XcodeGen 工程描述（生成「书源调试」iOS App 的 .xcodeproj）。
# 用法：xcodegen generate   （在仓库根目录运行）
# App 通过 SwiftPM 依赖本仓库的 BookonDebugKit / LegadoBookSource 两个本地 library product，
# 界面只做装配，业务逻辑全部在 BookonDebugKit。
name: BookonDebug
options:
  bundleIdPrefix: com.bookon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BookonDebugKit:
    path: .
targets:
  BookonDebug:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bookon.debug
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        # 注入构建元数据（Info.plist 里的 $(GIT_COMMIT) / $(CI_RUN_ID)）。
        # CI 在 xcodebuild 命令行用 GIT_COMMIT=… CI_RUN_ID=… 覆盖；本地为空。
        GIT_COMMIT: ""
        CI_RUN_ID: ""
        # 归档时不签名（CI 无开发者证书；本地真机调试可自行开启签名）。
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    dependencies:
      - package: BookonDebugKit
        product: BookonDebugKit
      - package: BookonDebugKit
        product: LegadoBookSource
